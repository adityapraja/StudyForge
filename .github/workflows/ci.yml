name: CI

on:
  push:
    branches: [ main, aditya-backend ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: dev
          POSTGRES_DB: tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm --prefix server ci

      - name: Run tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://postgres:dev@localhost:5432/tracker_test
          JWT_SECRET: test-jwt-secret-key-for-github-actions-32chars
        run: npm --prefix server test

