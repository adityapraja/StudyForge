services:
  db:
    image: postgres:16-alpine
    container_name: studyforge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracker
    ports:
      - "5434:5432"
    volumes:
      - studyforge-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tracker"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studyforge-pgdata:

